<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: parchment tone -->
  <rect width="1200" height="630" fill="#F5F0E8"/>

  <!-- Logo: Book + Sticky note -->
  <g transform="translate(490, 100)">
    <!-- Book body -->
    <rect x="0" y="0" width="110" height="150" rx="8" fill="#4A6B5D"/>
    <!-- Sticky note -->
    <rect x="90" y="48" width="55" height="30" rx="3" fill="#C4882B" transform="rotate(-3, 117, 63)"/>
    <!-- Question mark -->
    <text x="127" y="71" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">?</text>
  </g>

  <!-- Wordmark -->
  <text x="600" y="320" font-family="'MaruBuri', Georgia, serif" font-size="48" font-weight="bold" fill="#4A6B5D" text-anchor="middle" letter-spacing="4">북살롱</text>

  <!-- Slogan -->
  <text x="600" y="400" font-family="'MaruBuri', Georgia, serif" font-size="24" fill="#4A6B5D" text-anchor="middle" opacity="0.85">당신의 마침표가 누군가의 물음표와 만나는 곳</text>

  <!-- URL (muted) -->
  <text x="600" y="570" font-family="'MaruBuri', Georgia, serif" font-size="18" fill="#4A6B5D" text-anchor="middle" opacity="0.4">booksalon-nine.vercel.app</text>
</svg>
