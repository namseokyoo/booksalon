<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ecfeff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)" />
  <!-- Book icon -->
  <g transform="translate(460, 140)">
    <rect x="0" y="0" width="120" height="160" rx="8" fill="#0891b2" opacity="0.15" />
    <rect x="80" y="10" width="120" height="160" rx="8" fill="#0891b2" opacity="0.25" />
    <rect x="160" y="20" width="120" height="160" rx="8" fill="#0891b2" opacity="0.4" />
  </g>
  <!-- Title -->
  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#0e7490" text-anchor="middle">
    BOOKSALON
  </text>
  <!-- Subtitle -->
  <text x="600" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#64748b" text-anchor="middle">
    Sharing Knowledge Through Books
  </text>
  <!-- Korean subtitle -->
  <text x="600" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">
    &#xCC45; &#xC911;&#xC2EC; &#xC9C0;&#xC2DD; &#xACF5;&#xC720; &#xCEE4;&#xBBA4;&#xB2C8;&#xD2F0;
  </text>
  <rect x="0" y="622" width="1200" height="8" fill="url(#accent)" />
</svg>
