<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Book body -->
  <rect x="4" y="3" width="16" height="22" rx="3" fill="#4A6B5D"/>
  <!-- Sticky note protruding from right -->
  <rect x="16" y="10" width="12" height="8" rx="1.5" fill="#C4882B" transform="rotate(-3, 22, 14)"/>
  <!-- Question mark on sticky note -->
  <text x="22" y="17.5" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">?</text>
</svg>
