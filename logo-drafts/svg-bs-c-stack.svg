<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Variant C: Stacked (Vertical) — B top, S bottom -->
  <!-- Centered on vertical axis, thin divider, app-icon optimized -->

  <defs>
    <style>
      .main { fill: #4A6B5D; }
      .amber { fill: #C4882B; }
    </style>
  </defs>

  <!-- ===== B: Upper Section ===== -->
  <g class="main">
    <!-- Stem -->
    <path d="M 48 18 L 56 18 L 56 108 L 48 108 Z"/>
    <!-- Top serif -->
    <path d="M 40 14 L 88 14 L 88 20 L 40 20 Z"/>
    <!-- Bottom serif -->
    <path d="M 40 106 L 88 106 L 88 112 L 40 112 Z"/>
    <!-- Upper bowl -->
    <path d="
      M 56 20 L 78 20
      C 94 20, 106 26, 112 36
      C 118 46, 116 56, 108 62
      L 56 62 Z
      M 64 28 L 64 56
      L 76 56
      C 86 54, 94 48, 98 40
      C 100 36, 98 30, 90 28 Z
    " fill-rule="evenodd"/>
    <!-- Lower bowl -->
    <path d="
      M 56 66 L 82 66
      C 100 66, 114 74, 120 86
      C 124 96, 122 104, 112 108
      L 56 108 Z
      M 64 74 L 64 102
      L 80 100
      C 92 98, 102 92, 108 84
      C 112 78, 108 74, 98 72 Z
    " fill-rule="evenodd"/>
  </g>

  <!-- ===== Divider Line ===== -->
  <line x1="36" y1="122" x2="164" y2="122" stroke="#4A6B5D" stroke-width="0.75" opacity="0.4"/>
  <!-- Amber dot on divider -->
  <circle cx="100" cy="122" r="2.5" class="amber"/>

  <!-- ===== S: Lower Section ===== -->
  <g class="main">
    <path d="
      M 130 148
      C 124 138, 114 132, 102 132
      C 92 132, 84 138, 82 146
      C 80 154, 84 162, 94 168
      C 102 174, 112 178, 120 184
      C 130 192, 134 200, 134 210
      C 134 222, 126 230, 114 234
      C 104 236, 96 234, 90 228
      L 86 238 L 80 238 L 80 220 L 86 220
      C 90 230, 98 234, 108 232
      C 118 230, 126 224, 128 216
      C 130 208, 126 200, 118 194
      C 110 188, 100 184, 92 178
      C 82 170, 76 160, 78 150
      C 80 140, 86 132, 96 130
      C 106 128, 116 130, 124 136
      C 130 142, 134 146, 136 150
      L 136 130 L 142 130 L 142 152 L 136 152 Z
    "/>
    <!-- S top serif -->
    <path d="M 136 128 L 148 128 L 148 134 L 136 134 Z"/>
    <!-- S bottom serif -->
    <path d="M 76 234 L 88 234 L 88 240 L 76 240 Z"/>
  </g>
</svg>