<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Variant B: Interlocking Monogram -->
  <!-- B's right curves and S's left curves share/overlap space -->
  <!-- Overlap zone in darker #3D5A4E -->

  <defs>
    <style>
      .main { fill: #4A6B5D; }
      .dark { fill: #3D5A4E; }
      .amber { fill: #C4882B; }
    </style>
  </defs>

  <!-- B: Left character -->
  <g class="main">
    <!-- Stem -->
    <path d="M 18 26 L 26 26 L 26 174 L 18 174 Z"/>
    <!-- Top serif -->
    <path d="M 12 22 L 56 22 L 56 28 L 12 28 Z"/>
    <!-- Bottom serif -->
    <path d="M 12 172 L 56 172 L 56 178 L 12 178 Z"/>
    <!-- Upper bowl -->
    <path d="
      M 26 28 L 52 28
      C 68 28, 80 34, 86 44
      C 92 54, 90 66, 82 74
      L 26 74 Z
      M 34 36 L 34 68
      L 52 68
      C 64 66, 72 60, 76 52
      C 78 46, 74 40, 66 36 Z
    " fill-rule="evenodd"/>
    <!-- Lower bowl -->
    <path d="
      M 26 78 L 56 78
      C 74 78, 88 86, 94 98
      C 100 110, 98 124, 88 134
      L 26 134 Z
      M 34 86 L 34 128
      L 56 128
      C 70 126, 80 118, 84 108
      C 88 98, 84 90, 72 86 Z
    " fill-rule="evenodd"/>
  </g>

  <!-- S: Right character, shifted left to create overlap -->
  <g class="main">
    <path d="
      M 148 52
      C 142 42, 132 34, 118 34
      C 106 34, 96 40, 92 50
      C 88 60, 92 70, 102 78
      C 110 84, 120 88, 128 94
      C 138 102, 144 112, 144 126
      C 144 140, 138 150, 126 158
      C 116 164, 106 164, 96 160
      L 92 170 L 86 170 L 86 152 L 92 152
      C 96 160, 106 162, 116 160
      C 126 156, 134 146, 136 136
      C 138 124, 134 114, 124 106
      C 116 100, 106 96, 98 90
      C 88 82, 84 72, 86 60
      C 88 48, 96 38, 108 34
      C 118 30, 130 32, 140 40
      C 146 46, 150 50, 152 54
      L 152 34 L 158 34 L 158 56 L 152 56 Z
    "/>
    <!-- S top serif -->
    <path d="M 152 30 L 164 30 L 164 38 L 152 38 Z"/>
    <!-- S bottom serif -->
    <path d="M 82 166 L 94 166 L 94 174 L 82 174 Z"/>
  </g>

  <!-- Overlap zone: where B lower bowl meets S upper curve -->
  <path d="
    M 86 60 C 84 68, 86 76, 92 82
    L 94 98 C 88 90, 84 82, 86 72
    C 86 66, 86 62, 86 60 Z
  " class="dark" opacity="0.7"/>

  <!-- Overlap accent ellipse -->
  <ellipse cx="90" cy="78" rx="6" ry="14" class="dark" opacity="0.5"/>

  <!-- Amber accent dot at overlap center -->
  <circle cx="90" cy="78" r="2" class="amber"/>
</svg>