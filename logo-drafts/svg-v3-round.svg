<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- 변형 3: 라운드 — 가장 부드러운, squircle에 가까운 형태 -->

  <!-- 책 본체: 큰 라운드, squircle 느낌 -->
  <rect x="38" y="48" width="104" height="144" rx="16" ry="16" fill="#4A6B5D"/>

  <!-- 책등: 좌측 둥근 strip -->
  <rect x="38" y="48" width="12" height="144" rx="8" ry="0" fill="#3D5A4E"/>
  <rect x="44" y="48" width="6" height="144" fill="#3D5A4E"/>

  <!-- 쪽지: 더 둥근 모서리, 부드러운 형태 -->
  <rect x="106" y="14" width="26" height="50" rx="6" ry="6" fill="#C4882B" transform="rotate(3, 119, 39)"/>

  <!-- 물음표: 둥근 산세리프 스타일 (path로 직접 그리기) -->
  <!-- 산세리프 물음표: 둥근 곡선 + 점 -->
  <g transform="translate(119, 27)">
    <!-- 물음표 상단 곡선 -->
    <path d="M-4,-6 C-4,-11 0,-13 4,-13 C8,-13 10,-10 10,-7 C10,-3 6,-2 4,1 L2,4"
          stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- 물음표 점 -->
    <circle cx="2" cy="10" r="2" fill="#FFFFFF"/>
  </g>

  <!-- 워드마크 -->
  <text x="100" y="244" font-family="'MaruBuri', serif" font-size="28" fill="#4A6B5D" text-anchor="middle" letter-spacing="3">북살롱</text>
</svg>