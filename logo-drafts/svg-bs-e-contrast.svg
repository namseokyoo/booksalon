<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Variant E: Contrast — Thin Sans-Serif B + Bold Serif S -->
  <!-- Dual typography: B (geometric, uniform weight) vs S (high contrast serif) -->
  <!-- Reflects Pretendard + Maru Buri dual-font strategy -->

  <defs>
    <style>
      .main { fill: #4A6B5D; }
      .amber { fill: #C4882B; }
    </style>
  </defs>

  <!-- ===== B: Thin Geometric Sans-Serif ===== -->
  <!-- Uniform 4px stroke weight, no serifs, clean terminals -->
  <g class="main">
    <!-- Stem -->
    <path d="M 20 30 L 24 30 L 24 170 L 20 170 Z"/>
    <!-- Top bar -->
    <path d="M 20 30 L 60 30 L 60 34 L 20 34 Z"/>
    <!-- Middle bar -->
    <path d="M 20 98 L 54 98 L 54 102 L 20 102 Z"/>
    <!-- Bottom bar -->
    <path d="M 20 166 L 60 166 L 60 170 L 20 170 Z"/>
    <!-- Upper bowl arc -->
    <path d="
      M 58 34
      C 72 34, 82 42, 86 54
      C 90 66, 84 80, 72 90
      L 54 98
      L 54 94
      C 66 86, 74 76, 78 66
      C 82 56, 78 46, 68 38
      L 58 34 Z
    "/>
    <!-- Lower bowl arc -->
    <path d="
      M 58 102
      C 76 102, 90 112, 94 126
      C 98 140, 92 154, 78 162
      L 60 166
      L 60 162
      C 74 156, 84 146, 88 134
      C 92 122, 86 112, 74 106
      L 58 102 Z
    "/>
  </g>

  <!-- ===== S: Bold High-Contrast Serif ===== -->
  <!-- Thick main strokes, thin connecting strokes, prominent serifs -->
  <g class="main">
    <!-- S main body — thick curves with thin transitions -->
    <path d="
      M 160 56
      C 154 42, 142 34, 126 34
      C 114 34, 104 42, 102 54
      C 100 66, 108 76, 120 84
      L 132 90
      C 144 96, 154 108, 154 124
      C 154 142, 144 156, 128 162
      C 116 166, 108 164, 100 158

      L 96 168 L 88 168 L 88 146 L 96 146

      C 100 158, 110 164, 122 162
      C 136 158, 146 148, 148 136
      C 150 122, 142 112, 130 104
      L 118 98
      C 106 92, 98 82, 96 68
      C 94 54, 100 42, 112 36
      C 122 32, 136 34, 146 42
      C 152 48, 158 52, 162 58

      L 162 34 L 170 34 L 170 60 L 162 60 Z
    "/>

    <!-- S top serif — bold horizontal -->
    <path d="M 162 30 L 178 30 L 178 38 L 162 38 Z"/>
    <!-- S bottom serif — bold horizontal -->
    <path d="M 82 164 L 98 164 L 98 172 L 82 172 Z"/>

    <!-- S spine thickening (thick/thin contrast) -->
    <ellipse cx="120" cy="98" rx="4" ry="10" fill="#4A6B5D" transform="rotate(-30, 120, 98)"/>
  </g>

  <!-- Amber accent: thin vertical hairline separator -->
  <line x1="96" y1="48" x2="96" y2="152" stroke="#C4882B" stroke-width="1" opacity="0.6"/>
</svg>