<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" width="220" height="280">
  <!-- 변형 1-C: 쪽지 오른쪽 + 최소한의 책등 힌트 -->

  <!-- 책: 단순한 둥근 사각형 -->
  <rect x="30" y="40" width="110" height="150" rx="8" fill="#4A6B5D"/>

  <!-- 책등 힌트: 좌측 2px 얇은 라인 -->
  <line x1="38" y1="48" x2="38" y2="182" stroke="#3D5A4E" stroke-width="2" stroke-linecap="round"/>

  <!-- 쪽지: 책 오른쪽 변에서 옆으로 돌출 -->
  <rect x="120" y="88" width="55" height="30" rx="3" fill="#C4882B" transform="rotate(-3, 147, 103)"/>

  <!-- 물음표: 쪽지의 노출된 부분 중앙 -->
  <text x="157" y="111" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">?</text>

  <!-- 워드마크 -->
  <text x="110" y="242" font-family="'MaruBuri', serif" font-size="28" fill="#4A6B5D" text-anchor="middle" letter-spacing="2">북살롱</text>
</svg>