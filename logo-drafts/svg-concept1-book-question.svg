<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .wordmark { font-family: "KoPub Batang", "Nanum Myeongjo", serif; font-size: 42px; fill: #4A6B5D; letter-spacing: 2px; }
  </style>

  <g id="logo-combination-mark">
    <!-- Symbol: Abstract book with negative space question mark -->
    <g id="symbol" transform="translate(25 28)">
      <g id="book-shape" stroke-linejoin="round" stroke-linecap="round">
        <!-- Main book structure, drawn as two page blocks to create negative space -->
        <!-- The stroke is applied to the outside of the fill, giving the 2px line weight -->
        <path fill="#4A6B5D" stroke="#4A6B5D" stroke-width="2" d="M 98 125 V 82 C 98 55 75 35 50 35 C 20 35 10 60 10 85 C 10 115 25 135 55 142 C 75 147 98 138 98 125 Z" />
        <path fill="#4A6B5D" stroke="#4A6B5D" stroke-width="2" d="M 102 125 V 88 C 102 50 145 50 140 85 C 135 110 110 112 102 88 M 102 125 C 115 140 140 145 160 142 C 185 135 190 115 190 85 C 190 60 175 35 150 35 C 125 35 102 55 102 82"/>

        <!-- Dog-ear fold on the cover -->
        <path fill="#C4882B" d="M 168,35 L 190,35 L 190,57 Z" />
        <line x1="168" y1="35" x2="190" y2="57" stroke="#4A6B5D" stroke-width="2" />

        <!-- Dot for the question mark, placed in the negative space -->
        <circle cx="100" cy="132" r="5" fill="#C4882B" />
      </g>
    </g>

    <!-- Wordmark: "북살롱" -->
    <text class="wordmark" x="235" y="108" dominant-baseline="middle" text-anchor="start">북살롱</text>
  </g>
</svg>
